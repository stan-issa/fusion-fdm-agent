[project]
name = "fdm-sidecar"
version = "0.1.0"
description = "Agent sidecar for the Fusion FDM Agent add-in"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Installed by scripts/bootstrap.sh. Kept optional so the skeleton still
# bootstraps (with the echo backend) if the SDK cannot be fetched.
claude = ["claude-agent-sdk>=0.1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fdm_sidecar*"]
